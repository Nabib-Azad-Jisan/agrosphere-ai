name: checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r backend/requirements.txt
      - run: ruff check backend ml scripts
      - run: pytest -q
      - run: alembic -c backend/alembic.ini upgrade head
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run typecheck && npm test && npm run build
        working-directory: frontend
  e2e:
    runs-on: ubuntu-latest
    env:
      LOCAL_DEMO: 'true'
      DATABASE_URL: sqlite:///./ci-e2e.db
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: alembic -c backend/alembic.ini upgrade head
      - run: python -m backend.app.seed
      - run: npm run build
        working-directory: frontend
      - name: Start local services
        run: |
          python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          python -m backend.app.worker > worker.log 2>&1 &
          cd frontend
          npm start -- --hostname 127.0.0.1 > frontend.log 2>&1 &
          curl --retry 30 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:3000
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-traces
          path: frontend/test-results
