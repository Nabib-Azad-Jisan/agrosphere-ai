services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agrosphere}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-agrosphere}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agrosphere}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-agrosphere}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env}
      LOCAL_DEMO: "false"
      API_BASE_URL: http://api:8000/api/v1
    depends_on:
      db: {condition: service_healthy}
    command: sh -c "alembic -c backend/alembic.ini upgrade head && python -m backend.app.seed"
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment: *backend-env
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment: *backend-env
    command: python -m backend.app.worker
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
  frontend:
    build: frontend
    environment:
      BACKEND_URL: http://api:8000
      ADMIN_TOKEN: ${ADMIN_TOKEN}
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
volumes:
  postgres_data:
